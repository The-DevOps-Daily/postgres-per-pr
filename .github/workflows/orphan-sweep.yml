# Daily sweep for preview branches whose pull request is no longer open, or that are older than
# MAX_AGE_DAYS. The close workflow should have deleted them; this catches the ones it missed.
name: orphan-sweep

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: Delete preview branches older than this many days
        default: '7'
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/cleanup-orphans.mjs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '7' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
