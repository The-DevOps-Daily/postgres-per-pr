# The usual alternative, for comparison: a throwaway Postgres container per CI job. Same
# migrations, seed and tests, against an empty database that disappears with the job.
name: ci-container

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      TIMINGS_FILE: ${{ runner.temp }}/timings.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/wait-for-db.mjs
      - run: node scripts/migrate.mjs
      - run: node scripts/seed.mjs
      - name: Test
        run: |
          t=$(date +%s%3N)
          npm test
          echo "{\"step\":\"test\",\"ms\":$(( $(date +%s%3N) - t ))}" | tee -a "$TIMINGS_FILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: container-timings-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/timings.jsonl
          if-no-files-found: ignore
