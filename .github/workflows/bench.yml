# The measurements behind the post, run on GitHub's runners. Results are uploaded as an
# artifact and committed under results/.
name: bench

on:
  workflow_dispatch:
    inputs:
      bench:
        type: choice
        options: [branch-timing, limits]
        default: branch-timing
      runs:
        description: Runs for branch-timing
        default: '10'
      target_branches:
        description: Total branches in the project for limits (main included)
        default: '25'

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - if: inputs.bench == 'branch-timing'
        run: node bench/branch-timing.mjs
        env:
          RUNS: ${{ inputs.runs }}
      - if: inputs.bench == 'limits'
        run: node bench/limits.mjs
        env:
          TARGET_BRANCHES: ${{ inputs.target_branches }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ inputs.bench }}-${{ github.run_id }}
          path: results/
